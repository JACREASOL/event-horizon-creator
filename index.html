<title>Event Horizon Creator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column, numbered steps in a scroll rail, sticky back/next bar. Arc-teal accent, amber for balance flags. */
:root{
  --bg:#e8edf2; --panel:#f6f8fa; --ink:#13202b; --muted:#506070; --line:#c3cdd7;
  --arc:#0a7a73; --arc-ink:#ffffff; --arc-soft:#d3ece9; --flag:#9a5a08; --flag-soft:#f4e6cf; --bad:#a3302a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1117; --panel:#131c25; --ink:#e3ebf2; --muted:#8fa2b4; --line:#26343f;
  --arc:#46d2c2; --arc-ink:#052321; --arc-soft:#12332f; --flag:#e3a64e; --flag-soft:#33250f; --bad:#f08a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1117; --panel:#131c25; --ink:#e3ebf2; --muted:#8fa2b4; --line:#26343f;
  --arc:#46d2c2; --arc-ink:#052321; --arc-soft:#12332f; --flag:#e3a64e; --flag-soft:#33250f; --bad:#f08a82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;padding-bottom:96px}
header{padding:20px 0 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.mark{font:800 30px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin:0}
.sub{font:12px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rail{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.rail button{flex:0 0 auto;display:flex;gap:8px;align-items:center;background:transparent;color:var(--muted);border:1px solid var(--line);
  padding:8px 12px;border-radius:4px;font:500 13px var(--f-body);cursor:pointer}
.rail button b{font:500 12px var(--f-mono)}
.rail button[aria-current="step"]{background:var(--arc);color:var(--arc-ink);border-color:var(--arc)}
.rail button.done b::after{content:" ✓"}
main{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 18px}
h2{font:800 28px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
h3{font:600 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.lede{color:var(--muted);margin:0 0 16px;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:12px;cursor:pointer;font:inherit;min-width:0}
.card[aria-pressed="true"]{border-color:var(--arc);box-shadow:inset 0 0 0 1px var(--arc)}
.card strong{display:block;font:800 20px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.card small{display:block;color:var(--muted);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 11px var(--f-mono);background:var(--arc-soft);color:var(--arc);padding:2px 7px;border-radius:3px}
.chip.flag{background:var(--flag-soft);color:var(--flag)}
.chip.tier{background:transparent;border:1px solid var(--line);color:var(--muted)}
.detail{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.trait{padding:8px 0;border-bottom:1px dashed var(--line)}
.trait:last-child{border-bottom:0}
.trait b{font-weight:600}
.trait p{margin:2px 0 0;color:var(--muted)}
.flagnote{background:var(--flag-soft);color:var(--flag);border-radius:4px;padding:6px 10px;font-size:13px;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lab{flex:1 1 130px;min-width:0;font-weight:500}
.row .lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 18px var(--f-mono);cursor:pointer}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:2ch;text-align:center;font:500 16px var(--f-mono)}
.final{font:500 12px var(--f-mono);color:var(--muted);min-width:7ch;text-align:right}
.meter{font:500 13px var(--f-mono);color:var(--muted)}
.meter b{color:var(--ink)}
.meter.over{color:var(--bad)}
.spimg{display:block;width:100%;max-height:170px;object-fit:cover;object-position:top;border-radius:8px;margin-bottom:6px}
.spbig{display:block;width:min(280px,80%);margin:0 auto 10px;border-radius:12px;border:1px solid var(--line)}
.tgl{background:none;border:0;color:var(--muted,#9aa);font-size:16px;line-height:1;padding:2px 6px;min-width:28px;min-height:28px;cursor:pointer}
.abilities{margin:4px 0 8px 14px;padding-left:12px;border-left:2px solid var(--line)}
.abilities .row{border-bottom:0;padding:5px 0}
.fx{flex-basis:100%;color:var(--muted);font-size:13px}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:500 13px var(--f-body);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--arc);color:var(--arc-ink);border-color:var(--arc)}
input[type=text],textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
label.f{display:block;font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar div{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn{padding:10px 18px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
.btn.primary{background:var(--arc);color:var(--arc-ink);border-color:var(--arc)}
.btn:disabled{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--bg)}
.stat span{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:800 26px/1.1 var(--f-display)}
.warn{color:var(--flag);margin:4px 0;font-size:14px}
.ok{color:var(--arc);font-size:14px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;font:13px/1.5 var(--f-mono);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.assump{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:22px;padding-top:10px}
.assump li{margin:3px 0}
[hidden]{display:none!important}
.modes{display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow-x:auto;max-width:100%}
.modes button{padding:8px 11px;background:transparent;color:var(--muted);border:0;font:600 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--arc);color:var(--arc-ink)}
.result{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:5px;padding:10px 14px;margin:0 0 14px}
.result.good{border-left-color:var(--arc)}.result.bad{border-left-color:var(--bad)}
.result .big{font:800 24px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.result p{margin:2px 0;font:13px var(--f-mono);color:var(--muted)}
.res4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rc{border:1px solid var(--line);border-radius:5px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.rc span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rc b{font:800 26px/1 var(--f-display)}
.mbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.mbar i{display:block;height:100%}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sk{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:500 14px var(--f-body);cursor:pointer;min-width:0;text-align:left}
.sk b{font:500 13px var(--f-mono);color:var(--arc)}.sk.un{color:var(--muted)}.sk.un b{color:var(--muted)}
.log{font:12px/1.6 var(--f-mono);color:var(--muted);margin:0;padding-left:16px}
.testtag{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--flag-soft);color:var(--flag);padding:2px 7px;border-radius:3px}
.pcard{border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:12px;margin:0 0 10px}
.pcard h4{margin:0;font:800 22px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.pcard .sub2{font:12px var(--f-mono);color:var(--muted);margin:2px 0 8px}
.pst{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;margin:4px 0;font:12px var(--f-mono)}
.pst .step button{width:28px;height:28px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.card,.btn,.pill{transition:border-color .15s,background .15s}}
</style>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function bonus(){
  const b=Object.fromEntries(ATTRS.map(a=>[a,0])),sp=SPECIES[S.species];
  if(!sp)return b;
  for(const k in (sp.fixed||{}))b[k]+=sp.fixed[k];
  if(sp.vulkari){b[S.vPrimary]+=2;b[S.vExtra]+=1}
  if(sp.float){for(const k in S.hFloat)b[k]+=S.hFloat[k]}
  return b;
}
const final=a=>S.base[a]+bonus()[a];
const baseSpent=()=>ATTRS.reduce((n,a)=>n+S.base[a],0);
const floatLeft=()=>(SPECIES[S.species]&&SPECIES[S.species].float||0)-Object.values(S.hFloat).reduce((n,v)=>n+v,0);
const skillRank=s=>S.skills[s]||0;
const abKey=(s,a)=>s+'|'+a;
const abRank=(s,a)=>S.abil[abKey(s,a)]||0;
function abCost(s,a){const r=abRank(s,a);return Math.max(0,r-(S.freeAb===abKey(s,a)&&r>0?1:0))*unitCost(a)}
function spent(attr){
  let n=0;
  for(const s in SKILLS[attr])n+=skillRank(s);
  return n;
}
const skOf=s=>{for(const a of ATTRS)if(SKILLS[a][s])return SKILLS[a][s].concat(abCareer(s));return[]};
const cski=(c,it)=>it[3]?[].concat(it[3]):c.sk;
const cfx=(it,r)=>typeof it[2]==='function'?it[2](r):it[2];
const cab=n=>{const c=CAREER_AB[S.career];if(!c)return 0;const it=c.list.find(l=>l[0]===n);return it?Math.max(0,...cski(c,it).map(k=>abRank(k,'C:'+n))):0};
const abCareer=s=>{const c=CAREER_AB[S.career];return c?c.list.filter(l=>cski(c,l).includes(s)).map(l=>'C:'+l[0]):[]};
const abSpentSk=s=>skOf(s).reduce((n,x)=>n+abCost(s,x),0);
const abLeft=s=>skillRank(s)-abSpentSk(s);
const allSkills=()=>ATTRS.flatMap(a=>Object.keys(SKILLS[a]));
const overflowTotal=()=>0;
const bankLeft=()=>XP().abil-overflowTotal();
const canSpend=(s,c)=>true;
const left=attr=>final(attr)-spent(attr);
function resetAttr(attr){for(const s in SKILLS[attr]){delete S.skills[s];for(const a of SKILLS[attr][s])delete S.abil[abKey(s,a)]}}
function normalize(){
  for(const a of ATTRS){
    if(S.base[a]+bonus()[a]>attrCap())S.base[a]=Math.max(0,attrCap()-bonus()[a]);
    if(left(a)<0)resetAttr(a);
  }
  while(baseSpent()>totalPts()){const a=ATTRS.slice().sort((p,q)=>S.base[q]-S.base[p])[0];S.base[a]--;if(left(a)<0)resetAttr(a)}
  for(let g=0;g<60&&overflowTotal()>XP().abil;g++){
    const sk=allSkills().filter(s=>abSpentSk(s)>skillRank(s))[0];if(!sk)break;
    const o=skOf(sk).filter(x=>abRank(sk,x)>0).sort((p,q)=>unitCost(q)-unitCost(p))[0];
    if(!o)break;const k=abKey(sk,o);if(--S.abil[k]<=0)delete S.abil[k];if(S.freeAb===k&&!S.abil[k])S.freeAb='';
  }
  for(const k of Object.keys(S.abil)){const [sk,n]=k.split('|');if(n.startsWith('C:')&&!abCareer(sk).includes(n))delete S.abil[k]}
  S.freeAb='';if(!S.arcAb)S.arcAb={};
  {if(!S.spAb)S.spAb={};const sp=SPECIES[S.species],names=sp?sp.traits.map(t=>t[0]):[];
   for(const k of Object.keys(S.spAb))if(!S.spAb[k]||!names.includes(k))delete S.spAb[k];
   for(const k of Object.keys(S.spAb).reverse()){if(spUsed()<=spPts())break;delete S.spAb[k]}}for(const k of Object.keys(S.arcAb))if(!ARC_AB.find(a=>a[0]===k))delete S.arcAb[k];
  for(const k of Object.keys(S.skills))if(!allSkills().includes(k))delete S.skills[k];
  for(const k of Object.keys(S.abil)){const [sk,n]=k.split('|');if(!allSkills().includes(sk)||(n.startsWith('C:')&&!((CAREER_AB[S.career]||{list:[],sk:[]}).list.some(l=>l[0]===n.slice(2)&&cski(CAREER_AB[S.career],l).includes(sk))))||(!n.startsWith('C:')&&!(SKILLS[ATTRS.find(a=>SKILLS[a][sk])][sk]||[]).includes(n)))delete S.abil[k]}
}
const arcPool=()=>(final('knowledge')+final('memory'))*3+((SPECIES[S.species]||{}).arc||0);
const bonusChips=()=>{
  const sp=SPECIES[S.species];return sp};
function chipsFor(k){
  const sp=SPECIES[k],out=[];
  for(const a in (sp.fixed||{}))out.push(`+${sp.fixed[a]} ${AL[a]}`);
  if(sp.arc)out.push(`+${sp.arc} Arc`);
  if(sp.vulkari)out.push('+2 Muscles or Accuracy','+1 any');
  if(sp.float)out.push(`+${sp.float} floating`);
  return out.map(c=>`<span class="chip">${c}</span>`).join('');
}

function stepSpecies(){
  let h=`<h2>Choose your species</h2><p class="lede">Species sets your attribute bonuses, Speed, Silhouette and five species abilities. Tap one to read all five.</p><div class="grid">`;
  for(const k in SPECIES){const sp=SPECIES[k];
    h+=`<button class="card" data-a="species" data-v="${k}" aria-pressed="${S.species===k}"><img class="spimg" src="species/${k}.jpg" alt="" onerror="this.remove()"><strong>${sp.name}</strong><small>${sp.tag}</small><span class="chips">${chipsFor(k)}</span></button>`}
  h+='</div>';
  const sp=SPECIES[S.species];
  if(sp){
    h+=`<div class="detail"><img class="spbig" src="species/${S.species}.jpg" alt="${sp.name}" onerror="this.remove()"><h3>${sp.name} abilities</h3><p class="meter">Speed ${sp.spd*10} ft · Silhouette ${sp.sil}${sp.swim?` · Swim ${sp.swim*10} ft`:''} · Evasion ${Math.floor(sp.spd)-sp.sil}</p>`;
    h+=`<p class="meter ${spLeft()<0?'over':''}"><b>${spLeft()}</b> of ${spPts()} species points left. Each ability costs 1.</p>`;
    for(const t of sp.traits){const on=hasSp(t[0]);h+=`<div class="trait"><div class="row" style="border:0;padding:0"><b style="flex:1">${t[0]}</b><button class="pill" data-a="spab" data-v="${esc(t[0])}" aria-pressed="${on}" ${on||spLeft()>0?'':'disabled'}>${on?'Chosen':'Choose (1 pt)'}</button></div><p>${t[1]}</p></div>`}
    h+=`<div class="row"><span class="lab">Bonus species points<small>GM-awarded. Each unlocks another ability.</small></span><span class="step"><button data-a="xp" data-v="sp" data-d="-1" ${(XP().sp||0)<=0?'disabled':''}>−</button><output>${XP().sp||0}</output><button data-a="xp" data-v="sp" data-d="1" ${(XP().sp||0)>=5?'disabled':''}>+</button></span></div>`;
    if(sp.float){
      h+=`<h3>Place your ${sp.float} floating points <span class="meter">(${floatLeft()} left)</span></h3>`;
      for(const a of ATTRS)h+=`<div class="row"><span class="lab">${AL[a]}</span><span class="step"><button data-a="hf" data-v="${a}" data-d="-1" ${!(S.hFloat[a]>0)?'disabled':''}>−</button><output>${S.hFloat[a]||0}</output><button data-a="hf" data-v="${a}" data-d="1" ${floatLeft()<=0?'disabled':''}>+</button></span></div>`;
    }
    if(sp.flag)h+=`<div class="flagnote"><b>Balance watch:</b> ${sp.flag}</div>`;
    h+='</div>';
  }
  return h;
}

function stepAttrs(){
  const used=baseSpent(),b=bonus(),sp=SPECIES[S.species]||{};
  let h=`<h2>Distribute attributes</h2><p class="lede">Spend ${totalPts()} points. No attribute may pass ${attrCap()}${XP().attr>0?'':' at creation'}, species bonus included. Each point becomes a skill rank to spend in that attribute.</p>
  <p class="meter ${used>POINTS?'over':''}"><b>${totalPts()-used}</b> of ${totalPts()} points left</p>
  <div class="row"><span class="lab">Bonus attribute points<small>Awarded in play. Raises the cap to 10.</small></span><span class="step"><button data-a="xp" data-v="attr" data-d="-1" ${XP().attr<=0?'disabled':''}>−</button><output>${XP().attr}</output><button data-a="xp" data-v="attr" data-d="1" ${XP().attr>=20?'disabled':''}>+</button></span></div>`;
  for(const a of ATTRS){
    const cap=attrCap()-b[a];
    h+=`<div class="row"><span class="lab">${AL[a]}<small>${ADESC[a]}</small></span>
      ${b[a]?`<span class="chip">+${b[a]} species</span>`:''}
      <span class="step"><button data-a="attr" data-v="${a}" data-d="-1" ${S.base[a]<=0?'disabled':''}>−</button><output>${S.base[a]}</output><button data-a="attr" data-v="${a}" data-d="1" ${S.base[a]>=cap||used>=totalPts()?'disabled':''}>+</button></span>
      <span class="final">= ${final(a)} total</span></div>`;
  }
  h+=`<h3>Derived</h3><div class="stats"><div class="stat"><span>Arc Pool</span><b>${arcPool()}</b></div><div class="stat"><span>HP</span><b>20</b></div><div class="stat"><span>Speed</span><b>${SPD()}</b></div><div class="stat"><span>Evasion</span><b>${evBase()}</b></div></div>

  return h;
}
function stepCareer(){
  let h=`<h2>Choose your career</h2><p class="lede">A career is what your character does for a living. It sets your starting Digi tier and your contacts. It is not a class.</p><div class="grid">`;
  for(const [n,t] of CAREERS)h+=`<button class="card" data-a="career" data-v="${n}" aria-pressed="${S.career===n}"><strong>${n}</strong><span class="chips" style="margin-top:6px"><span class="chip tier">Tier ${t} · ${TIER[t]} Digi</span></span></button>`;
  return h+'</div>';
}
function stepSkills(){
  let h=`<h2>Skills and abilities</h2>
  <p class="lede">Every point of an attribute is one skill rank. You need at least rank 1 in a skill to take its abilities. Per the v0.4 book, abilities are free in the first playtest (the cost shown is for later) and can be ranked up with no limit.</p>`;
  S.col=S.col||{};
  h+=`<div class="actions" style="margin:0 0 6px"><button class="btn" data-a="col" data-v="*open">Expand all</button><button class="btn" data-a="col" data-v="*shut">Collapse all</button></div>`;
  for(const a of ATTRS){
    const pool=final(a),l=left(a),ac=!!S.col['a:'+a];
    h+=`<h3><button class="tgl" data-a="col" data-v="a:${a}" aria-expanded="${!ac}">${ac?'▸':'▾'}</button> ${AL[a]} <span class="meter ${l<0?'over':''}">· <b>${l}</b> of ${pool} left</span></h3>`;
    if(ac)continue;
    const sk=SKILLS[a];
    if(!Object.keys(sk).length){h+=`<p class="lede" style="font-size:13px"></p>`;continue}
    for(const s in sk){
      const r=skillRank(s),sc=!!S.col['s:'+s],nab=sk[s].filter(x=>abRank(s,x)>0).length;
      h+=`<div class="row"><span class="lab"><button class="tgl" data-a="col" data-v="s:${s}" aria-expanded="${!sc}">${sc?'▸':'▾'}</button> ${s}${sc&&nab?` <span class="chip">${nab} abilit${nab>1?'ies':'y'}</span>`:''}</span><span class="step"><button data-a="skill" data-v="${s}" data-at="${a}" data-d="-1" ${r<=0?'disabled':''}>−</button><output>${r}</output><button data-a="skill" data-v="${s}" data-at="${a}" data-d="1" ${l<=0||r>=5?'disabled':''}>+</button></span></div>`;
      const abs=sk[s];
      const showAbs=abs;
      if(showAbs.length&&!sc){
        h+=`<div class="abilities"><p class="meter" style="margin:0 0 4px">${r>0?`${s}: abilities are free in the first playtest. Cost shown is for later.`:`Put a rank in ${s} to unlock these.`}</p>`;
        for(const x of showAbs){
          const k=abKey(s,x),ar=abRank(s,x),free=S.freeAb===k;
          const maxR=(MAXR[x]||5)>1?99:1;
          const uc=unitCost(x),step=ar<maxR&&reqOk(x)&&skOk(s,x)&&r>0;
          h+=`<div class="row"><span class="lab">${x} <span class="chip">${uc}${(MAXR[x]||5)>1?'/rank':' pt'}${EST.includes(x)?' est.':''}</span>${free?' <span class="chip">free R1</span>':''}</span><span class="step"><button data-a="abil" data-v="${k}" data-d="-1" ${ar<=0?'disabled':''}>−</button><output>${ar}</output><button data-a="abil" data-v="${k}" data-d="1" ${step?'':'disabled'}>+</button></span><span class="fx">${ar?AB[x](ar):'Not learned.'}</span></div>`;
        }
        h+='</div>';
      }
    }
  }
  h+=`<h3>${S.career?S.career+' abilities':'Career abilities'}</h3>`;
  const cc=CAREER_AB[S.career];
  if(!S.career)h+='<p class="lede" style="font-size:13px">Pick a career to see its abilities.</p>';
  else if(!cc)h+='<p class="lede" style="font-size:13px">No abilities written for this career yet.</p>';
  else{
    h+=`<p class="meter">Each ability is paid from the skill shown on its chip. Left: ${cc.sk.map(k=>`${k} <b>${abLeft(k)}</b>`).join(' · ')}. Only ${S.career} abilities show here.</p>${cc.note?`<p class="meter">${cc.note}</p>`:''}<div class="abilities">`;
    for(const it of cc.list){
      const x=it[0],r=it[1],sks=cski(cc,it),mx=(it[4]||1)>1?99:1,own=cab(x),rq=it[5],rqok=!rq||cab(rq[0])>=rq[1];
      const can=own<mx&&rqok&&(own?sks.some(k=>abRank(k,'C:'+x)&&canSpend(k,r)):sks.some(k=>skillRank(k)>0&&canSpend(k,r)));

    }
    h+='</div>';
  }
  return h;
}

    else if(p[1]==='Welder Torch')out.push({n:'Welder Torch',sk:'Melee Combat',band:0,dice:[1,6],plus:final('muscles'),melee:true});

const COVERS=[['None',0],['Partial +1',1],['Half +3',3],['Full +5',5]];

  if(n1){L.push('Natural 1: automatic miss. +1 Momentum.');p.favor=Math.min(5,p.favor+1)}

  const p=PL();
  if(n>p.arc){
    const had=p.arc,r=roll(100),e=ARC_OVER.find(x=>r<=x[0]),L=[`Spent ${n} with only ${had} left. Pool is empty.`];p.arc=0;
    const dmg=(k,s)=>{let t=0;for(let i=0;i<k;i++)t+=roll(s);p.hp=Math.max(0,p.hp-t);return t};
    let x='';
    if(e[1]==='Catastrophic Collapse')x=` Took ${dmg(3,6)} damage (3d6).`;
    else if(e[1]==='Energy Hemorrhage'){x=` Took ${dmg(2,6)} damage (2d6). Arc pool halved: take it off your max by hand.`}
    else if(e[1]==='Arc Surge')x=` Took ${dmg(1,6)} damage (1d6).`;
    else if(e[1]==='Resonance Burst'){p.arc=Math.min(arcPool(),5);x=' Regained 5 Arc.'}
    L.push(`Arc Overload d100 = ${r===100?'00':r}: ${e[1]}. ${e[2]}${x}`);
    if(e[1]==='Neural Burnout'||e[1]==='Energy Hemorrhage')L.push('Pool reductions are not tracked automatically.');
    setRes('Arc Overload',L,'bad');
  }
  else{p.arc-=n;setRes(`Spent ${n} Arc`,[`${p.arc} left in pool.`],'neutral')}
}
const PMAX={hp:p=>p.hpMax,ap:p=>p.apMax,arc:()=>arcPool(),favor:()=>5,sil:()=>5,still:()=>9,enemyEv:()=>15,ecn:()=>19,mod:()=>5,dmg:()=>99,spend:()=>30,hpMax:()=>200,apMax:()=>60};
const PMIN={mod:-5,hpMax:1,dmg:1,spend:1};
function playAct(a,t){
  const p=PL(),v=t.dataset.v;
  switch(a){
    case 'pn':{const k=t.dataset.k,dd=+t.dataset.d;let n=p[k]+dd;if(k==='ecn'&&n===1)n=dd>0?2:0;p[k]=clamp(n,PMIN[k]??0,PMAX[k](p));if(k==='hpMax')p.hp=Math.min(p.hp,p.hpMax);break}
    case 'pset':p[t.dataset.k]=+v;break;
    case 'ptog':p[t.dataset.k]=!p[t.dataset.k];break;
    case 'pcond':{p.cond=p.cond||{};if(p.cond[v])delete p.cond[v];else p.cond[v]=true;break}
    case 'pmom':{const m=MOM[v];if(!m||p.favor<m[0])break;p.favor-=m[0];
      if(!p.res)p.res={h:'Momentum',lines:[],tone:'neutral'};
      p.res.lines.push(`Spent ${m[0]} Momentum: ${m[1]}.`);p.log.unshift(`R${p.round} · Momentum: ${m[1]}`);
      if(v==='stab'&&p.hp<=0)p.hp=1;break}
    case 'pskill':{p.last={t:'skill',v};const lab=v;doSkill(lab,v==='Acrobatics'?skillBonus('Athletics')+abRank('Athletics','Acrobatics'):skillBonus(v));break}
    case 'pattack':p.last={t:'attack'};doAttack();break;
    case 'pdefend':p.last={t:'defend'};doDefend();break;
    case 'preroll':{if(p.favor<1||!p.last)break;p.favor--;const l=p.last;
      if(l.t==='skill')doSkill(l.v,l.v==='Acrobatics'?skillBonus('Athletics')+abRank('Athletics','Acrobatics'):skillBonus(l.v));
      else if(l.t==='attack')doAttack();else doDefend();
      p.res.lines.push('Rerolled with 1 Momentum.');break}
    case 'pdmg':takeDamage(p.dmg);break;
    case 'pheal':{
      if(v==='breather'){const r=roll(6);p.hp=Math.min(p.hpMax,p.hp+r);setRes('Breather (5–10 min)',[`Recovered 1d6 = ${r} HP. Cannot be in danger. Once per hour.`],'good')}
      if(v==='rest'){p.sig={};const h=Math.ceil(p.hpMax/2);p.hp=Math.min(p.hpMax,p.hp+h);p.arc=Math.min(arcPool(),p.arc+1);p.uny=false;setRes('Rest (1–2 hours)',[`Recovered half max HP (${h}). +1 natural Arc (test value). Regain 1 use per ability.`],'good')}
      if(v==='down'){p.sig={};p.hp=p.hpMax;p.ap=p.apMax;p.arc=Math.min(arcPool(),p.arc+8);p.uny=false;p.rapid=false;setRes('Downtime (8+ hours)',['Full HP, armor restored, +8 natural Arc (test value), all resources reloaded.'],'good')}
      if(v==='hour'){p.arc=Math.min(arcPool(),p.arc+1);setRes('One hour passes',['+1 natural Arc.'],'neutral')}
      break}
    case 'parc':spendArc(p.spend);break;
    case 'pcast':{const a=ARC_AB.find(x=>x[0]===v);if(!a)break;if(final('knowledge')<2){setRes('Cannot cast',['Arc abilities need Knowledge 2+.'],'bad');break}
      if(a[6]){p.sig=p.sig||{};if(p.sig[v])break;p.sig[v]=true}
      const n=arcCost(a[1]);spendArc(n);
      if(!p.res)break;p.res.h=(p.res.h.startsWith('Arc Overload')?'Arc Overload: ':'')+v;
      p.res.lines.unshift(`${v}: ${a[2]}`);
      if(a[3]){let t=0;const rs=[];for(let i=0;i<a[3][0];i++){const r=roll(a[3][1]);rs.push(r);t+=r}p.res.lines.push(`${a[3][0]}d${a[3][1]}: [${rs.join(', ')}] = ${t}`)}
      p.log.unshift(`R${p.round} · ${v} (${n} Arc)`);break}
    case 'pround':{p.round++;if(v==='moved')p.still=0;else p.still=Math.min(9,p.still+1);
      const L=[v==='moved'?'You moved, so Evasion resets.':'You stood still: Evasion drops 1.'];
      if(p.cond&&p.cond.Poisoned){const r=roll(4);p.hp=Math.max(0,p.hp-r);L.push(`Poisoned: ${r} damage (1d4).${p.hp<=0?' You are at 0 HP.':''}`)}
      setRes(`Round ${p.round}`,L,'neutral');break}
    case 'prapid':{if(p.rapid)break;p.rapid=true;const r=roll(4);p.hp=Math.min(p.hpMax,p.hp+r);setRes('Natural Regeneration',[`1d4 = ${r} HP recovered.`],'good');break}
    case 'pnew':p.round=1;p.still=0;p.uny=false;p.rapid=false;setRes('New encounter',['Round reset. Once-per-encounter abilities refreshed.'],'neutral');break;
    case 'pclear':p.log=[];break;
  }
}
function playView(){
  const p=PL(),pool=arcPool(),ev=evasion(),w=WEAPONS[p.wi],ab=atkBonus(),kab=knownAbilities();
  const bar=(v,m,c)=>`<div class="mbar"><i style="width:${m?Math.round(100*v/m):0}%;background:var(${c})"></i></div>`;
  const stp=(k,val,min,max)=>`<span class="step"><button data-a="pn" data-k="${k}" data-d="-1" ${val<=min?'disabled':''}>−</button><output>${val}</output><button data-a="pn" data-k="${k}" data-d="1" ${val>=max?'disabled':''}>+</button></span>`;
  const pills=(k,list,cur)=>`<div class="pillrow">`+list.map(([n,v])=>`<button class="pill" data-a="pset" data-k="${k}" data-v="${v}" aria-pressed="${cur===v}">${n}</button>`).join('')+`</div>`;
  const res=p.res?`<section class="result ${p.res.tone}" aria-live="polite"><div class="big">${esc(p.res.h)}</div>${p.res.lines.map(l=>`<p>${esc(l)}</p>`).join('')}${p.last&&p.favor>0?`<div class="actions" style="margin:8px 0 0"><button class="btn" data-a="preroll">Reroll the last roll (spend 1 Favor)</button></div>`:''}</section>`
    :`<section class="result"><div class="big">Ready</div><p>Tap a skill or Attack. Rolls show up here.</p></section>`;
  let h=`<h2 style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">${esc(S.name)||'Unnamed'} <span class="sub" style="font-weight:400">${(SPECIES[S.species]||{}).name||'No species'} · ${esc(S.career)||'No career'} · Round ${p.round}</span></h2>
  <p class="lede"><span class="testtag">v0.4</span> HP 20, armor from your gear. Arc recovery amounts are still test values.</p>${res}
  <div class="res4">
   <div class="rc"><span>HP</span><b>${p.hp}/${p.hpMax}</b>${bar(p.hp,p.hpMax,'--arc')}${stp('hp',p.hp,0,p.hpMax)}</div>
   <div class="rc"><span>Armor</span><b>${p.ap}/${p.apMax}</b>${bar(p.ap,p.apMax,'--flag')}${stp('ap',p.ap,0,p.apMax)}</div>
   <div class="rc"><span>Arc Pool</span><b>${p.arc}/${pool}</b>${bar(p.arc,pool,'--arc')}${stp('arc',p.arc,0,pool)}</div>
   <div class="rc"><span>Momentum</span><b>${p.favor}/5</b>${bar(p.favor,5,'--flag')}${stp('favor',p.favor,0,5)}</div>
   <div class="rc"><span>Evasion</span><b>${ev}</b><span class="meter">Speed ${SPD()} − Silhouette ${p.sil} − ${p.still} still</span></div>
  </div>
  <h3>Skill rolls</h3>
  <div class="row"><span class="lab">Difficulty</span></div>${pills('dn',DNS,p.dn)}
  <div class="row" style="border:0"><span class="lab">Extra modifier</span>${stp('mod',p.mod,-5,5)}</div>
  <div class="skgrid">`;
  for(const a of ATTRS)for(const s in SKILLS[a]){
    h+=`<button class="sk ${skillRank(s)?'':'un'}" data-a="pskill" data-v="${s}"><span>${s}</span><b>${sg(skillBonus(s))}</b></button>`;
    if(s==='Athletics'&&abRank('Athletics','Acrobatics'))h+=`<button class="sk" data-a="pskill" data-v="Acrobatics"><span>Acrobatics</span><b>${sg(skillBonus('Athletics')+abRank('Athletics','Acrobatics'))}</b></button>`;
  }
  h+=`</div><p class="lede" style="font-size:13px;margin-top:6px">Greyed skills are untrained (+0).</p>
  ${kab.length?`<h3>Abilities</h3><div class="abilities">${kab.map(a=>`<div class="row" style="align-items:flex-start"><span class="lab">${a.x} <span class="chip">R${a.r}</span></span><span class="fx" style="flex:1">${a.fx}</span></div>`).join('')}</div>`:''}
${ARC_AB.some(a=>hasArc(a[0]))?`<h3>Arc abilities</h3><div class="actions" style="margin-top:0">${ARC_AB.filter(a=>hasArc(a[0])).map(a=>`<button class="btn" data-a="pcast" data-v="${a[0]}" ${a[6]&&p.sig&&p.sig[a[0]]?'disabled':''}>${a[0]} · ${a[1]===0?'Free':arcCost(a[1])+' Arc'}${a[6]?' (1/Rest)':''}</button>`).join('')}</div>`:''}
  <h3>Attack</h3>
  <div class="pillrow">${WEAPONS.map((x,i)=>`<button class="pill" data-a="pset" data-k="wi" data-v="${i}" aria-pressed="${p.wi===i}">${x.n} · ${x.dice[0]}d${x.dice[1]}${x.plus?'+'+x.plus:''}</button>`).join('')}</div>
  ${S.buy&&Object.keys(S.buy).length?'':'<p class="lede" style="font-size:13px">No weapons bought. Add some on the Equipment step.</p>'}
  <div class="row"><span class="lab">Target evasion</span>${stp('enemyEv',p.enemyEv,0,15)}</div>
  <div class="row"><span class="lab">Target cover</span></div>${pills('tcover',COVERS.map(([n,v])=>[n,v]),p.tcover)}
  <div class="row"><span class="lab">Target critical number<small>0 = none (ECN 2–19)</small></span>${stp('ecn',p.ecn,0,19)}</div>
  <div class="pillrow" style="margin-top:6px"><button class="pill" data-a="ptog" data-k="aim" aria-pressed="${p.aim}">Aimed Shot +1</button></div>
  <div class="actions"><button class="btn primary" data-a="pattack" ${ab.blocked?'disabled':''}>Attack ${ab.blocked?'':sg(ab.b)}</button><button class="btn" data-a="pdefend">Defend (${ev}${p.cover?` + ${p.cover}`:''})</button></div>
  <p class="meter">${ab.blocked?esc(ab.blocked):esc(ab.parts.join(' · '))}</p>
  <div class="row"><span class="lab">My cover</span></div>${pills('cover',COVERS,p.cover)}
  <h3>Damage and healing</h3>
  <div class="row"><span class="lab">Take damage<small>Armor first, then HP. At 0 HP: regain 5 and roll the Injury Table</small></span>${stp('dmg',p.dmg,1,99)}<button class="btn" data-a="pdmg">Apply</button></div>
  <div class="actions"><button class="btn" data-a="pheal" data-v="breather">Breather (1d6)</button><button class="btn" data-a="pheal" data-v="rest">Rest (half HP)</button><button class="btn" data-a="pheal" data-v="down">Downtime (full)</button><button class="btn" data-a="pheal" data-v="hour">+1 hour (Arc)</button></div>
  <div class="row"><span class="lab">Spend Arc<small>Past your pool triggers Overload</small></span>${stp('spend',p.spend,1,30)}<button class="btn" data-a="parc">Spend</button></div>
  <h3>Rounds</h3>
  <div class="actions"><button class="btn" data-a="pround" data-v="moved">Next round · I moved</button><button class="btn" data-a="pround" data-v="still">Next round · stood still</button><button class="btn" data-a="pnew">New encounter</button>${hasSp('Natural Regeneration')?`<button class="btn" data-a="prapid" ${p.rapid?'disabled':''}>Natural Regeneration (1d4)</button>`:''}</div>
  ${hasSp('Unyielding')?`<p class="meter">Unyielding: ${p.uny?'used this encounter':'ready'}</p>`:''}
  <h3>Momentum</h3>
  <div class="actions" style="margin-top:0">${Object.entries(MOM).map(([k,m])=>`<button class="btn" data-a="pmom" data-v="${k}" ${p.favor<m[0]?'disabled':''}>${m[0]}: ${m[1]}</button>`).join('')}</div>
  <h3>Conditions</h3>
  <div class="pillrow">${CONDS.map(([n,d])=>`<button class="pill" title="${d}" data-a="pcond" data-v="${n}" aria-pressed="${!!(p.cond&&p.cond[n])}">${n}</button>`).join('')}</div>
  <p class="meter">${CONDS.filter(c=>p.cond&&p.cond[c[0]]).map(c=>c[0]+': '+c[1]).join(' · ')||'Tap a condition to track it.'}</p>
  <h3>Adjust</h3>
    <div class="row"><span class="lab">Max armor</span>${stp('apMax',p.apMax,0,60)}</div>
  <div class="row"><span class="lab">Silhouette</span>${stp('sil',p.sil,0,4)}</div>
  <h3>Roll log <button class="pill" data-a="pclear" style="padding:3px 8px;font-size:12px">Clear</button></h3>
  <ul class="log">${p.log.map(l=>`<li>${esc(l)}</li>`).join('')||'<li>Nothing yet.</li>'}</ul>`;
  return h;
}

/* ---------- shell ---------- */
const FNS=[stepSpecies,stepAttrs,stepCareer,stepSkills,stepArc,stepGear,stepSheet];
function done(i){return [!!S.species&&(S.species!=='human'||floatLeft()===0)&&spLeft()<=0,baseSpent()===totalPts(),!!S.career,ATTRS.every(a=>left(a)===0),Object.keys(S.arcAb||{}).length>0,(digiSpent()>0&&digiSpent()<=budget())||!!(S.gear||S.notes),warnings().length===0][i]}
function render(){
  normalize();WEAPONS=myWeapons();save();
  const nb=S.mode!=='build';
  if(window.EHParty)EHParty.push();
  if(window.EHAcct)EHAcct.push();
  document.getElementById('modes').innerHTML=[['build','Build'],['play','Play']].concat(window.EHMap?[['map','Map']]:[]).concat(window.EHParty?[['party','Party']]:[]).concat(window.EHAcct?[['acct','Account']]:[]).map(([k,n])=>`<button data-a="mode" data-v="${k}" aria-pressed="${S.mode===k}">${n}</button>`).join('');
  document.getElementById('rail').hidden=nb;document.querySelector('.bar').hidden=nb;
  if(S.mode==='play'){document.getElementById('main').innerHTML=playView();return}
  if(S.mode==='acct'&&window.EHAcct){document.getElementById('main').innerHTML=EHAcct.view();return}
  if(S.mode==='map'&&window.EHMap){document.getElementById('main').innerHTML=EHMap.view();return}
  if(S.mode==='party'&&window.EHParty){document.getElementById('main').innerHTML=EHParty.view();return}
  document.getElementById('rail').innerHTML=STEPS.map((n,i)=>`<button data-a="go" data-v="${i}" class="${done(i)&&i!==S.step?'done':''}" ${i===S.step?'aria-current="step"':''}><b>${i+1}</b>${n}</button>`).join('');
  document.getElementById('main').innerHTML=FNS[S.step]();
  document.getElementById('back').disabled=S.step===0;
  const nx=document.getElementById('next');nx.style.visibility=S.step===STEPS.length-1?'hidden':'visible';
  const sp=SPECIES[S.species];
  document.getElementById('status').textContent=`${sp?sp.name:'No species'} · ${S.career||'No career'}`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const v=t.dataset.v,d=+t.dataset.d,at=t.dataset.at;
  switch(t.dataset.a){
    case 'mode':S.mode=v;break;
    case 'go':S.step=+v;break;
    case 'species':if(S.species!==v){S.species=v;S.spAb={};S.hFloat={};S.freeAb='';for(const a of ATTRS)if(S.base[a]+0>attrCap())S.base[a]=attrCap()}break;
    case 'ftrait':S.fTrait=v;break;
    case 'vp':S.vPrimary=v;break;
    case 'vx':S.vExtra=v;break;
    case 'hf':{const n=(S.hFloat[v]||0)+d;if(n<=0)delete S.hFloat[v];else S.hFloat[v]=n;break}
    case 'col':{S.col=S.col||{};if(v==='*open')S.col={};else if(v==='*shut'){S.col={};for(const a of ATTRS){for(const k in SKILLS[a])S.col['s:'+k]=1}}else if(S.col[v])delete S.col[v];else S.col[v]=1;break}
    case 'attr':S.base[v]=Math.max(0,S.base[v]+d);break;
    case 'career':S.career=v;break;
    case 'skill':{const r=Math.max(0,skillRank(v)+d);if(r)S.skills[v]=r;else delete S.skills[v];
      for(const x of SKILLS[at][v]){const k=abKey(v,x);if(!r&&abRank(v,x)>0)delete S.abil[k]}break}
    case 'buy':{const n=Math.max(0,(S.buy[v]||0)+d);if(n)S.buy[v]=Math.min(n,9);else delete S.buy[v];break}
    case 'armor':S.armor=S.armor===v?'':v;break;
    case 'xp':{const x=XP();x[v]=Math.max(0,Math.min(v==='attr'?20:v==='sp'?5:40,(x[v]||0)+d));break}
    case 'spab':{if(!S.spAb)S.spAb={};if(S.spAb[v])delete S.spAb[v];else if(spLeft()>0)S.spAb[v]=true;break}
    case 'arcab':{if(!S.arcAb)S.arcAb={};if(S.arcAb[v])delete S.arcAb[v];else{const a=ARC_AB.find(x=>x[0]===v);if(a&&arcOK(a)&&arcKnown()<arcMax())S.arcAb[v]=true}break}
    case 'abc':{const cc=CAREER_AB[S.career];if(!cc)break;const it=cc.list.find(l=>l[0]===v);if(!it)break;
      const sks=cski(cc,it),mx=(it[4]||1)>1?99:1,rq=it[5],ck=n=>'C:'+n,cur=sks.find(k=>abRank(k,ck(v)));
      if(d<0){if(cur){const n=abRank(cur,ck(v))-1;if(n)S.abil[abKey(cur,ck(v))]=n;else delete S.abil[abKey(cur,ck(v))]}
        for(const o of cc.list){const q=o[5];if(q&&q[0]===v&&cab(v)<q[1])for(const k of cski(cc,o))delete S.abil[abKey(k,ck(o[0]))]}}
      else if(!rq||cab(rq[0])>=rq[1]){
        if(cur){if(abRank(cur,ck(v))<mx&&canSpend(cur,it[1]))S.abil[abKey(cur,ck(v))]++}
        else{const k=sks.filter(k=>skillRank(k)>0&&canSpend(k,it[1])).sort((a,b)=>abLeft(b)-abLeft(a))[0];if(k)S.abil[abKey(k,ck(v))]=1}}
      break}
    case 'abil':{const n=Math.max(0,(S.abil[v]||0)+d);if(n)S.abil[v]=n;else delete S.abil[v];for(const x in REQ){const q=REQ[x],k2=abKey(q[0],x);if(S.abil[k2]&&abRank(q[0],q[1])<q[2])delete S.abil[k2]}break}
    case 'free':{S.freeAb=S.freeAb===v?'':v;break}
    case 'newchar':{const k={pid:S.pid,pcode:S.pcode,inParty:S.inParty,gm:S.gm};S=Object.assign(blank(),k);break}
    case 'copy_':break;
    case 'copy':{const txt=textSheet(),m=document.getElementById('msg');
      const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('sheet'));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent='Sheet selected. Copy it manually.'};
      try{navigator.clipboard.writeText(txt).then(()=>{m.textContent='Copied.'},fallback)}catch(err){fallback()}
      return}
  }
  if(t.dataset.a.startsWith('acct')){if(window.EHAcct)EHAcct.act(t.dataset.a,t)}else if(t.dataset.a.startsWith('map')){if(window.EHMap)EHMap.act(t.dataset.a,t)}else if(t.dataset.a.startsWith('pty')){if(window.EHParty)EHParty.act(t.dataset.a,t)}else if(/^p[a-z]+$/.test(t.dataset.a))playAct(t.dataset.a,t);
  const y=scrollY;render();if(t.dataset.a!=='go'&&t.dataset.a!=='mode')scrollTo(0,y);else scrollTo(0,0)
});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;S[f]=e.target.value;save();
  if(f==='name'){const h=document.querySelector('main h2');if(h)h.textContent=S.name||'Character sheet';const p=document.getElementById('sheet');if(p)p.textContent=textSheet()}});
document.getElementById('back').onclick=()=>{S.step=Math.max(0,S.step-1);render();scrollTo(0,0)};
document.getElementById('next').onclick=()=>{S.step=Math.min(STEPS.length-1,S.step+1);render();scrollTo(0,0)};
render();
</script>
